description: |
  Cyclotab for ZMK (port of Pascal Getreuer's QMK Cyclotab).
  Any &kp binding that sends one of `keys` (e.g. LA(TAB)) starts a cycle: the
  modifier stays held after release, so further taps cycle through windows.
  The next other key press/release ends the cycle and is consumed.
compatible: "zmk,cyclotab"
properties:
  keys:
    type: array
    required: true
    description: Hotkeys, e.g. <LA(TAB) LS(LA(TAB)) LG(TAB) LS(LG(TAB))>
  timeout-ms:
    type: int
    default: 1000
    description: Release the mods this long after the last hotkey tap. 0 = never.

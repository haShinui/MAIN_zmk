description: |
  Cyclotab: tap to press a modifier (e.g. Alt) and Tab. The modifier stays held
  after the tap so further taps keep cycling. Ended by cyclotab-end keys, by
  the timeout, or by switching to another cyclotab key.
compatible: "zmk,behavior-cyclotab"
include: zero_param.yaml
properties:
  modifier:
    type: int
    required: true
    description: Modifier keycode to hold, e.g. <LALT>, <LGUI>, <LCTRL>
  key:
    type: int
    required: true
    description: Keycode tapped on every press, e.g. <TAB>
  layer:
    type: int
    required: true
    description: Layer that is dropped when the cycle ends
  timeout-ms:
    type: int
    default: 1000
    description: Release the modifier this long after the last tap. 0 = no timeout.

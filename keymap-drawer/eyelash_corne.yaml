- p: [15, 16]
  k: {t: '$$mdi:keyboard-return$$', type: enter}
- p: [17, 16]
  k: {t: '$$mdi:apple-keyboard-shift$$', h: '$$mdi:gesture-tap-hold$$'}
  l: [BASE]
- p: [2, 3]
  k: {t: '$$mdi:backspace$$', type: backspace}
  l: [BASE]
- p: [3, 4]
